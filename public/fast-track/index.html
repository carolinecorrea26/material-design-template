<!-- Original standalone Fast Track mockup from the November 2 design chat.

<style>

  #fast-track-life .ft-app { --ft-bg: light-dark(#f9fafc,#151b26); --ft-paper: light-dark(#ffffff,#202936); --ft-ink: light-dark(#353b48,#edf1f7); --ft-muted: light-dark(#49596f,#bdc9db); --ft-line: light-dark(#dce3ed,#3d4a60); --ft-blue: light-dark(#0668ff,#86b3ff); --ft-blue-ink: light-dark(#ffffff,#102440); --ft-tint: light-dark(#ecf3ff,#273b56); --ft-green: light-dark(#009465,#33b88d); --ft-soft: light-dark(#eaf7f0,#243c35); --ft-warm: light-dark(#fffcf0,#3b3525); --ft-danger: light-dark(#b72127,#ffabb0); background:var(--ft-bg); color:var(--ft-ink); font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; width:100%; box-sizing:border-box; min-height:100dvh; border:0; border-radius:0; overflow:clip; }

  #fast-track-life .ft-library-field .MuiFormHelperText-root { margin-top:6px; }
  #fast-track-life .ft-field { display:flex; flex-direction:column; gap:6px; min-width:0; font-size:12px; font-weight:600; }
  #fast-track-life .ft-field input,#fast-track-life .ft-field select,#fast-track-life .ft-field textarea { width:100%; min-width:0; background:var(--ft-paper); color:var(--ft-ink); border:1px solid var(--ft-line); border-radius:8px; padding:11px 12px; min-height:46px; font-size:16px; font-weight:400; }

New York, New York 10010`},ratings:[{grade:"A++",source:"A.M. Best"},{grade:"AAA",source:"Fitch Ratings"},{grade:"Aa1",source:"Moody's Investors Service"},{grade:"AA+",source:"Standard & Poor's"}],ratingsAsOf:"1 Third Party Rating Reports as of 09/30/2025.",legal:["New York Life Insurance Company is licensed/authorized to transact business in all of the 50 United States, the District of Columbia, Puerto Rico and Canada. However, not all group policies it underwrites are available in all jurisdictions. Please check the Coverage detail sections for current availability. New York Life Insurance Company's state of domicile is New York, and NAIC ID is #66915.","NEW YORK LIFE and the NEW YORK LIFE Box Logo are trademarks of New York Life Insurance Company."],links:{termsOfUse:"NYL Terms of Use",privacyNotice:"NYL Privacy Notice"},termsOfUseContent:{title:"New York Life Terms of Use",sections:[{type:"paragraph",text:"If you are applying online, you are applying for insurance coverage using electronic processes that include the use of electronic records and electronic signatures. New York Life is required by law to provide you with certain disclosures and information regarding your insurance application. Upon your consent, these notices will be delivered electronically."},{type:"paragraph",text:"Please print or download New York Life's Online Privacy Notice and retain it for your records. Your consent also permits the use of electronic records and electronic signatures throughout your application."},{type:"paragraph",text:"If you do not consent to electronic delivery of these disclosures, New York Life cannot continue processing your electronic application. A paper application may be required instead."},{type:"paragraph",text:"This notice contains important information regarding your consent to the use of electronic signatures and records. Please read it carefully before continuing."},{type:"paragraph",text:"By electronically signing your application, you consent to the use of electronic transactions, electronic signatures, and electronic delivery of records related to your insurance application. You also agree that any consent or agreement transmitted through this website is legally binding and has the same legal effect as your handwritten signature."},{type:"paragraph",text:"Your consent applies to:"},{type:"list",items:["Information required to complete your insurance application.","Your insurance application.","Associated notices, disclosures, and supporting documents."]},{type:"paragraph",text:"You may withdraw your consent at any time. However, withdrawing consent will prevent New York Life from continuing to process your electronic application. You may instead submit a paper application through your plan administrator."},{type:"heading",level:2,text:"System Requirements"},{type:"list",items:["128-bit SSL encryption.","Screen resolution of 1280 \xD7 800 or higher.","A current version of Google Chrome. Other browsers may not be fully supported."]}],revision:"November 1, 2011"},privacyNoticeContent:{title:"New York Life Privacy Notice",sections:[{type:"heading",level:2,text:"Our Information Practices"},{type:"paragraph",text:"This Privacy Notice applies to information collected in connection with financial products and services provided by members of the New York Life Family of Companies that are subject to the Gramm-Leach-Bliley Act."},{type:"heading",level:2,text:"Information We Collect"},{type:"list",items:["Information provided on applications and forms.","Transaction information.","Publicly available information.","Website and cookie information.","Consumer reporting information.","Health information collected with authorization."]},{type:"heading",level:2,text:"Safeguarding Your Information"},{type:"paragraph",text:"We maintain physical, electronic, and procedural safeguards designed to protect confidential information and comply with applicable regulations."},{type:"heading",level:2,text:"How We Use Information"},{type:"paragraph",text:"Information may be shared as permitted by law for normal business administration and servicing."},{type:"list",items:["Within the New York Life Family of Companies.","With service providers performing business functions.","When required by law."]},{type:"heading",level:2,text:"Privacy Notice Distribution"},{type:"paragraph",text:"This Privacy Notice was last updated in January 2026."},{type:"address",lines:["Group Membership Compliance Officer","New York Life Insurance Company","44 South Broadway","White Plains, NY 10601"]},{type:"paragraph",text:"Phone: (866) 891-0631 Ext. 3004595"},{type:"heading",level:2,text:"New York Life Family of Companies"},{type:"paragraph",text:"The New York Life Family of Companies includes New York Life Insurance Company and numerous affiliated insurance, investment, and asset management companies."},{type:"note",text:"Form 22294-CA (January 2026) \xB7 \xA9 2026 New York Life Insurance Company"}]}};var a3={alertTitle:"Important information about your application and next steps:",alertItems:[{title:"Check your information",description:"Make any edits now\u2014changes can't be made after this step."},{title:"Review and authorize",description:"Read the consent information carefully and provide your consent to continue."}],healthQuestionsNote:{title:"Answer health questions",description:"Based on your coverage, you'll answer a short set of health questions in the next step. This only takes a few minutes."},readAndSignTitle:"Read & Sign",readAndSignContent:`Please read carefully the statements below.
I understand that payment of a premium contribution for insurance does not mean that there is any coverage in force before the effective date as specified by New York Life.

I understand that New York Life has the right to require additional information and, if necessary, an examination by a physician. I ask New York Life to rely on all such statements made on this form, and any supplements to it, while considering this request. I also understand that the coverage afforded will be in consideration of the answers and statements set forth above.

AUTHORIZATION: I authorize physicians, practitioners, hospitals, clinics or medically related facilities, pharmacies, pharmacy benefit managers, laboratories, insurance companies, MIB, LLC ("MIB"), medical information retrieval services, electronic health record companies or health care information technology companies to release to New York Life Insurance Company or New York Life Insurance and Annuity Corporation (collectively "New York Life"), its reinsurers, or the plan administrator at New York Life's expense, whether in electronic or paper form, information they may have about my physical or mental health, my prescription drug history, diagnostic testing and copies of my drug and alcohol records, including my records relating to substance abuse education, prevention, training, treatment, rehabilitation or research. This also may include information on the diagnosis, treatment, and testing results related to HIV, AIDS, and sexually transmitted diseases, unless otherwise restricted by state law. Mental health professionals may provide their records, excluding psychotherapy notes, of my diagnosis, functional status, treatment plan, symptoms, prognosis, progress to date, medication prescription and monitoring, and clinical test results for the purpose of evaluating my application for insurance. This includes protected health information and any health information I have previously requested be withheld from further disclosure, and including my history, their findings, diagnoses and treatment.

MIB, other insurance companies, any employers, financial institutions, and consumer reporting agencies may provide to New York Life at New York Life's expense data about: my driving record; my financial information; any criminal activity; hazardous sport or aviation activity; use of alcohol or drugs; any claim of eligibility for disability income benefits; other applications for insurance; and other policies of insurance. New York Life may obtain an investigative consumer report about me.

A photocopy of this AUTHORIZATION and request form shall be as valid as the original. My authorized agent or representative, or I may request a copy of this AUTHORIZATION. This AUTHORIZATION may be used for a period of 24 months from the date signed, unless sooner revoked as stated in the Important Notice. The AUTHORIZATION may be revoked at any time by sending written notice to New York Life. My revocation will not be effective to the extent that New York Life or any other person already has disclosed or collected information or taken other action in reliance on it, or to the extent that New York Life has a legal right to contest a claim under an insurance certificate or the certificate itself.

I understand and agree that:

New York Life may use the information obtained by this AUTHORIZATION to determine my eligibility for insurance, to evaluate a claim for benefits, to contest coverage, or for reinsurance or other insurance purposes, including development of new products and services.
To obtain the data described above, New York Life may give my personal information to the above persons or organizations.
New York Life may give data collected about me to: its subsidiaries; affiliates; parent company; agents and their staffs; organizations that perform business functions for it; reinsurers, and others as permitted or required by law.
The medical information New York Life obtains through this AUTHORIZATION may no longer be subject to federal laws and regulations that apply to an individual's protected health information (the Health Insurance Portability and Accountability Act (HIPAA) Privacy Rule). The information New York Life obtains through this AUTHORIZATION may become subject to further disclosure.
Authorizing the disclosure of this health information is voluntary.
I can refuse to sign this AUTHORIZATION. However, failure to execute this AUTHORIZATION may result in New York Life being unable to collect information relating to me and result in denial of my application for insurance.

CONSENT: By signing and dating this application, I request the insurance applied for (for myself and/or my dependents); I attest that the information provided in my application is true and complete to the best of my knowledge and belief and that I, and any other person proposed for insurance, has read the Fraud Notice (if any) above and the IMPORTANT NOTICE , including how my/our information is exchanged with MIB; and I, and any other person proposed for insurance, consents to authorize the disclosure of information, to and from the providers noted in the IMPORTANT NOTICE, including making a brief report of my/our protected health information to MIB.`,electronicConsentTitle:"Electronic Consent",electronicConsentContent:`NEW YORK LIFE INSURANCE COMPANY

Customer Electronic Consent and Disclosure
(the "Consent")

IMPORTANT NOTICE - PLEASE READ CAREFULLY

What is the purpose of this Consent?

You are applying for insurance coverage from New York Life Insurance Company ("New York Life") and have expressed your desire to electronically sign the application Forms for the insurance certificate (the "Insurance Certificate") and electronically receive communications related to the application for the Insurance Certificate. To conduct this business electronically, you must provide New York Life and its authorized designees with your consent. By clicking the "Submit" button below, and applying your electronic signature, you will be providing New York Life and its authorized designees, with your consent:

(a) to have the Required Documents described in this Consent delivered to you electronically;

(b) to execute via electronic means the application Forms that are described in this Consent; and

(c) to agree to all of the terms and conditions set forth below in this Consent.

If you do not want to have the Required Documents delivered to you electronically, if you do not want to execute via electronic means the Application Forms, and/or if you do not agree with all of the terms and conditions of this Consent, you may not conduct business electronically with New York Life, and you must not click the submit link below. In this event you may contact the Administrator below to request a paper application.

What does the Consent cover once I click "Sign" and apply my electronic signature?

The Consent covers your agreement to all of the terms and conditions of the Consent, including your agreement to:

1. execute via electronic means any documents that New York Life requires to be signed in connection with the application process for this Insurance Certificate (the "application Forms");

2. be bound with the same force and effect as if you had affixed your signature on paper, by hand, when you click "Submit" and apply your electronic signature or otherwise apply your electronic signature to the application Forms;

3. receive via electronic means the application Forms, Important Notice and New York Life Online Privacy Notice that New York Life is required to deliver and/or make available to you, in writing, in connection with the Insurance Certificate (the "Required Documents").

Even though you have provided New York Life with the Consent, New York Life may, at its option, deliver the Required Documents to you on paper.

May I obtain paper copies of the Required Documents and the Consent?

Yes. You may obtain paper copies of any of the Required Documents and/or the Consent at any time and without charge by contacting New York Life at GMAD_DocumentRequest@newyorklife.com or (914) 846-3017.


Should I maintain copies of the Required Documents received by electronic means?

Yes. You agree to print or save the Required Documents and to keep printed or electronic copies of them for your records. If you have any trouble with printing or saving, you should contact New York Life at GMAD_DocumentRequest@newyorklife.com or (914) 846-3017.

In what form will I receive Required Documents by electronic means?

Required Documents will be provided in Portable Document Format (PDF). I agree that I must have Adobe Acrobat viewer software installed on my personal computer in order to view these Required Documents. I agree that if I do not have the ability to access and retain PDF documents, I should not click the "Submit" button. By clicking the "Submit" button, I acknowledge that I can access the Required Documents on my personal computer in PDF Form.

How will I receive Required Documents by electronic means?

There are links to the notices and documents on this website and in this notice. Click on the linked text to open the document. Upon selecting the link, you will be able to view, download, and/or print all the Required Documents pertaining to your application. For reference, these required documents are:
Important Notice
New York Life Online Privacy Notice

How long will this Consent remain in effect?

This Consent shall become effective once you click the "Submit" button below and shall remain in effect until you withdraw your consent (as described in the next section) or the Insurance Certificate is issued.

What if I change my mind?

You may only withdraw your consent to do business electronically before the Insurance Certificate is issued. If you would like to do so, you must provide New York Life with a written withdrawal of your consent to do business electronically. This will terminate the Consent and your Insurance Certificate application as of the date you sign your withdrawal, subject to any action New York Life took before recording the withdrawal. If we issue the Insurance Certificate before we record your withdrawal, and you wish to cancel this Insurance Certificate thereafter, you must exercise your right to surrender the Insurance Certificate according to its terms. There is no charge to withdraw your consent.

What if my contact information changes?

You must keep New York Life informed of any changes to your e-mail address. You may inform New York Life of any such changes by contacting New York Life at GMAD_DocumentRequest@newyorklife.com or (914) 846-3017.

Are there any hardware or software requirements to do business electronically with New York Life?

Yes. To do business electronically with New York Life and to access and retain the Required Documents sent or made available to you electronically by New York Life requires that you have a personal computer or mobile device with appropriate browser software, such as Microsoft Internet Explorer, Mozilla Firefox, or equivalent, and email software as well as communications access to the Internet. You must ensure that the mobile device that you are using to view or electronically sign the application Forms allows you to access all associated content. This access may incur charges from Internet Service Providers and telephone or cable companies. These costs are your responsibility. In order to view certain Required Documents in the Portable Document Format (PDF), you must have Adobe Acrobat viewer software. This software is available for download, free of charge, from the Adobe Web site (www.adobe.com). You must have the ability to save the Required Documents to a storage device for later reference or have a connection between your computer or mobile device and a printer so you can print out the Required Documents.

Any person who knowingly presents false or fraudulent information to obtain or amend insurance coverage or to make a claim for the payment of a loss is guilty of a crime and may be subject to fines and confinement in state prison.`,C58:"FRAUD NOTICE:  Any person who knowingly presents a false or fraudulent claim for payment of a loss or benefit or knowingly presents false information in an application for insurance is guilty of a crime and may be subject to fines and confinement in prison.",C59:"FRAUD NOTICE: Any person who knowingly presents a false or fraudulent claim for payment of a loss or benefit or knowingly presents false information in an application for insurance is guilty of a crime and may be subject to fines and confinement in prison.",C60:"FRAUD NOTICE: Any person who knowingly presents a false or fraudulent claim for payment of a loss or benefit or knowingly presents false information in an application for insurance is guilty of a crime and may be subject to fines and confinement in prison.",C61:"FRAUD NOTICE: Any person who knowingly and with intent to defraud any insurance company or other person files an application for insurance or statement of claim containing any materially false information or conceals for the purpose of misleading, information concerning any fact material thereto commits a fraudulent insurance act, which is a crime and subjects such person to criminal and civil penalties.",C62:"FRAUD NOTICE: Any person who knowingly presents a false or fraudulent claim for payment of a loss or benefit or knowingly presents false information in an application for insurance is guilty of a crime and may be subject to fines and confinement in prison.",C63:"FRAUD NOTICE: Any person who knowingly or willfully presents a false or fraudulent claim for payment of a loss or benefit or who knowingly or willfully presents false information in an application for insurance is guilty of a crime and may be subject to fines and confinement in prison.",C64:"FRAUD NOTICE - WARNING: It is a crime to provide false or misleading information to an insurer for the purpose of defrauding the insurer or any other person. Penalties include imprisonment and/or fines. In addition, an insurer may deny insurance benefits, if false information materially related to a claim was provided by the applicant.",C65:"FRAUD NOTICE: Any person who knowingly and with intent to injure, defraud, or deceive any insurer files a statement of claim or an application containing any false, incomplete, or misleading information is guilty of a felony of the third degree.",C66:"FRAUD NOTICE: Any person who knowingly presents a false or fraudulent claim for payment of a loss or benefit or knowingly presents false information in an application for insurance may be guilty of insurance fraud as determined by a court of law.",C67:"FRAUD NOTICE: It is a crime to knowingly provide false, incomplete, or misleading information to an insurance company for the purpose of defrauding the company. Penalties may include imprisonment, fines or a denial of insurance benefits.",C68:"FRAUD NOTICE - WARNING: Any person who includes any false or misleading information on an application for an insurance policy is subject to criminal and civil penalties.",C69:"FRAUD NOTICE: For accident and health insurance only, any person who knowingly and with intent to defraud any insurance company or any other person files an application for insurance or statement of claim containing any materially false information, or conceals for the purpose of misleading, information concerning any fact material thereto, commits a fraudulent insurance act, which is a crime, and shall also be subject to civil penalty not to exceed five thousand dollars and the stated value of the claim for each such violation.",C70:"FRAUD NOTICE - WARNING: Any person who knowingly, and with intent to injure, defraud or deceive any insurer, makes any claim for the proceeds of an insurance policy containing any false, incomplete or misleading information is guilty of a felony.",C71:"FRAUD NOTICE: Any person who, knowingly and with the intent to defraud, presents false information in an insurance request form, or who presents, helps or has presented a fraudulent claim for the payment of a loss or other benefit, or presents more than one claim for the same damage or loss, will incur a felony, and upon conviction will be penalized for each violation with a fine no less than five thousand (5,000) dollars nor more than ten thousand (10,000) dollars, or imprisonment for a fixed term of three (3) years, or both penalties. If aggravated circumstances prevail, the fixed established imprisonment may be increased to a maximum of five (5) years; if attenuating circumstances prevail, it may be reduced to a minimum of two (2) years.",C72:"FRAUD NOTICE: It is a crime to knowingly provide false, incomplete, or misleading information to an insurance company for the purpose of defrauding the company.  Penalties include imprisonment, fines, and denial of insurance benefits.",C73:"FRAUD NOTICE: It is a crime to knowingly provide false, incomplete, or misleading information to an insurance company for the purpose of defrauding the company.  Penalties include imprisonment, fines, and denial of insurance benefits.",C74:"FRAUD NOTICE: Any person who, with the intent to defraud or knowing that he is facilitating a fraud against an insurer, submits an application or files a claim containing false or deceptive statements may have violated state law.",C76:"FRAUD NOTICE: Any person who knowingly and with intent to defraud any insurance company or other person files an application for insurance or statement of claim containing any materially false information or conceals for the purpose of misleading, information concerning any fact material thereto commits a fraudulent insurance act, which may be a crime and may subject such person to criminal and civil penalties.\uFFA0",C111:`DIVIDEND:
I further understand and agree that any dividend apportioned to the group policy may be retained by the American Bar Endowment to support its charitable mission supporting law-related education, research, and public service projects and programs unless such dividends are claimed by me (or the certificate owner) pursuant to the procedures described in the plan brochures, on the back of the ABE premium notices, and in the plan description material on the ABE website. (Notice of the approximate percentage of premium available, if any, for contribution or refund will be published in the December/January issue of the ABA Journal and on ABE\u2019s website in October.) The Internal Revenue Service has ruled that members who donate their dividends to ABE are eligible for a charitable contribution deduction on their individual income tax returns to the fullest extent permitted by law.`,C125:`DIVIDEND NOTICE (For applicants requesting new member coverage only)
Please note: Members who wish to contribute dividends payable on ABE group policies to ABE to support its charitable mission need not do anything further. However, members Members who do not want to contribute these dividends are required to "opt out" each year, using the procedures described below. By signing this application, you are agreeing to make an annual decision whether to opt out. Do not sign the application if you do not agree with these procedures.`,C126:"For the first policy year only,* if you want to opt out, sign and date the initial election below. After the first policy year of your participation, a written request for refund must be made each year and must reach ABE by December 15th. Written requests may be sent by mail, fax, or email to dividends@abendowment.org. You will be sent a confirmation\u037E retain this for your records. If it is not received within 3 weeks, contact ABE promptly to obtain another.",C127:`\u25CF*5-Year Banded Term Life Insurance

(which ends on the 31st day of October, following the effective date of your insurance)`,C139:"ELECTION (For the first year of this coverage only. Members currently insured in this plan must send a written request each year to ABE any time during the year, but no later than December 15.) I do not choose to donate any available dividends to ABE for its charitable work for the first policy year in which I participate in this program. In so choosing, I understand that I will not be entitled to a charitable contribution deduction on my income tax return."},dividendScreenshot:{source:"User-provided ABE dividend screenshot, October 5 2026",title:"How your Assignment of Dividends to ABE works - The Unique Charitable Giving Feature of ABE-Sponsored Insurance",paragraphs:["Founded by the ABA in 1942, the American Bar Endowment (ABE) is a \xA7501(c)(3) not-for-profit public charity. ABE fulfills its charitable mission of improving the administration of justice, one of the profession's highest obligations, by making annual grants to support law-related research, public service, and educational projects and programs, including those conducted by the American Bar Association's Fund for Justice and Education (FJE) and the American Bar Foundation (ABF). ABE also makes Opportunity Grants to support boots-on-the-ground efforts to expand the availability of legal services to underserved communities. ABE maintains a Legal Legacy Fund for the support of its grantees.","By participating in ABE's group insurance programs, designed for and available only to practicing lawyers and their families, you can contribute to these efforts. By enrolling in ABE-sponsored insurance programs, unless you notify the ABE otherwise pursuant to the procedures set forth below, you agree to donate to ABE your share of any dividends payable on the group policies for ABE to use for its charitable purposes. Donations of dividends to ABE are tax-deductible to the insured to the fullest extent permitted by law.","Your dividend donation to ABE makes a difference. These funds, after administrative expenses, are the primary source of ABE's charitable grants and additions to the Legal Legacy Fund. Insureds who donate their dividends help meet their professional and public responsibilities, as well as obtain valuable coverage for their families. About 83% of insured lawyers donate their dividends.","Insureds are notified each year by late January of the amount, if any, of their dividend for the prior year that has been donated to ABE. (Dividends are not guaranteed, and in any given year, a given policy may not pay a dividend; dividends will vary from year to year.)","If you do not want to donate your dividend to ABE, you must request a \u201Crefund\u201D of your dividend as follows: any time after the first policy year of your participation, for each year that you want a refund of your dividend, ABE must receive a written request from you for refund (by mail or email to dividends@abendowment.org), by as early as January 1 but not later than December 15 of the year for which a refund is requested. ABE will send confirmation of any request received, and you should retain that confirmation for your records as proof that your refund request was timely received. If you do not receive a confirmation within 3 weeks of sending a request to ABE, please contact the ABE. (Special instructions for new applicants are contained in the application and apply to any dividends earned during the first policy year only). The approximate percentage of premium available for refund (if any) on each ABE-sponsored insurance policy will be published in each December/January issue of the ABA Journal and on ABE's website each October. You do not need to wait for this information as refund requests are accepted beginning January 1.","Donation acknowledgments of your dividend, or dividend checks (if applicable), are mailed by late January the following year. If you receive a donation acknowledgment but you did not intend to donate your dividend to ABE, you may request a one-time waiver of the December 15 deadline by asking for a refund, if you have not previously requested such a waiver.","Please note: Insureds who do not want to contribute dividends to ABE must make a written request for refund each year, using the procedures above. When you sign the application for insurance, you are agreeing to donate your dividends unless you otherwise notify the ABE to request a refund. Do not sign the application if you do not agree with these procedures."]}};var zo=Mh.cells,yI={CO:"C56",CA:"C57",AL:"C58",AR:"C59",LA:"C60",PA:"C61",RI:"C62",MD:"C63",DC:"C64",FL:"C65",KS:"C66",ME:"C67",NJ:"C68",NY:"C69",OK:"C70",PR:"C71",TN:"C72",WA:"C73",VA:"C74",VT:"C76"},X0={version:1,fraud:{defaultText:zo.C55,byJurisdiction:Object.fromEntries(Object.entries(yI).map(([e,t])=>[e,zo[t]])),sourceReferences:["Read & Sign!B53:C76"]},blocks:[]},lge={...X0,blocks:[{key:"dividend-acknowledgement",title:Mh.dividendScreenshot.title,paragraphs:[...Mh.dividendScreenshot.paragraphs,zo.C111],fields:["dividend-acknowledgement"],sourceReferences:["Read & Sign!C111","User dividend screenshot","User: required acknowledgement; always-visible optional identity fields; no election checkbox"],when:{applicant:"member"}},{key:"dividend-election",title:"Dividend notice and first-year election",paragraphs:[zo.C125,zo.C126],listItems:[zo.C127,zo.C128,zo.C129,zo.C130,zo.C131,zo.C132,zo.C133,zo.C134,zo.C136,zo.C137,zo.C138].map(e=>e.replace(/^[●•\s]*\*/,"").replace(/\n/,`*

  root.addEventListener('change', event => {
    const el=event.target;
    if(el.matches('[data-budget-range]')){state.amount=Math.max(1,Math.min(20,Math.round(Number(el.value)/rawSamplePrice(50000))))*50000;state.answers.coverageChoice=String(state.amount);updatePrice();save();}
    if (el.matches('[data-range]')) {state.amount=Number(el.value);state.answers.coverageChoice=String(state.amount);updatePrice();save();}
    if(el.matches('[data-adjust-range]')) {state.draftAmount=Number(el.value);state.answers.adjustChoice=String(state.draftAmount);updatePrice();}
    if (el.matches('[data-assume]')) {
      const key=el.dataset.assume;
      if (key==='age' && (!Number.isInteger(Number(el.value)) || Number(el.value)<18 || Number(el.value)>90)) {el.value=state.age;return;}
      state[key]=key==='age'?Number(el.value):el.value; updatePrice(); save();
    }
    if (el.matches('[data-check]')) {state.answers[el.dataset.check]=el.checked;if(['reviewed','mibConsent','healthElectronic'].includes(el.dataset.check) && !el.checked)state.mibComplete=false;if(['sole','corporation'].includes(el.dataset.check) && state.screen===1)invalidateStreamConsent();if(['businessSame','sole','corporation'].includes(el.dataset.check))render();if(state.screen===1)queueStreamChoice(el.closest('[data-flow-key]')?.dataset.flowKey);}
    if (el.matches('[data-answer]')) {
      const budgetBefore=rawSamplePrice();
      state.answers[el.dataset.answer]=el.value;
      if(el.dataset.answer==='sex') state.gender=el.value;
      if(el.dataset.answer==='tobacco') state.tobacco=el.value;
      if(state.screen===0 && ['sex','tobacco'].includes(el.dataset.answer))fitBudget(budgetBefore);
      if(state.screen===1)invalidateStreamConsent();
      render();if(['sex','tobacco'].includes(el.dataset.answer))save();
      if(state.screen===1)queueStreamChoice(el.closest('[data-flow-key]')?.dataset.flowKey);
    }
    if (el.matches('[data-health]')) {state.health[el.dataset.health]=el.value;state.answers.healthFinalConsent=false;render();if(state.screen===1)queueStreamChoice('health-'+el.dataset.health);}
    if (el.matches('[data-field]')) {
      const key=el.dataset.field; state.answers[key]=el.value;
      if ((key==='benFirst' || key==='benLast') && !state.answers.share && !state.answers.extraBen) {state.answers.share='100';render();}
    }
  });
  root.addEventListener('click', event => {
    if(state.accountMenu && !event.target.closest('.ft-account-control')){state.accountMenu=false;render();}
    if(state.screen===1 && event.target.matches('input[data-answer],input[data-health],input[data-check]'))queueStreamChoice(event.target.closest('[data-flow-key]')?.dataset.flowKey);
    const el=event.target.closest('button'); if (!el) return;
    if(el.hasAttribute('data-flow-next')){streamAdvance(el.dataset.flowNext);return;}
    if(el.hasAttribute('data-auth-method')){state.authMethod=el.dataset.authMethod;state.authStage='identify';state.authError='';state.authValues.authPassword='';state.authValues.authCode='';render();return;}
    if (el.hasAttribute('data-goto')) {const target=Number(el.dataset.goto);if(target===2 && validate(1)){state.error='Complete your information before continuing to health.';render();return;}go(target);return;}
    if(el.hasAttribute('data-edit-about')){const key=['membership','name','address','otherLife','height'][Number(el.dataset.editAbout)];revealStream(key);return;}
    if(el.hasAttribute('data-edit-qd')){state.qdIndex=Number(el.dataset.editQd);state.answers.healthFinalConsent=false;render();showActiveStage();return;}
    if(el.hasAttribute('data-portal-tab')) {state.portalTab=el.dataset.portalTab;state.toast='';if(state.screen!==5)go(5);else{render();apps.find(app=>!app.closest('[data-variant]')?.hidden)?.scrollIntoView({block:'start',behavior:'instant'});}return;}
    if(el.hasAttribute('data-health-part')) {if(el.dataset.healthPart==='questions' && !consentCurrent())return;state.healthPart=el.dataset.healthPart;state.error='';render();return;}
    if(el.hasAttribute('data-review-health')) {state.healthPart=consentCurrent()?'questions':'consent';go(2);return;}
    if(el.hasAttribute('data-review-consent')) {state.healthPart='consent';go(2);return;}
    if(el.hasAttribute('data-track')) {state.selectedApplication=el.dataset.track;render();apps.find(app=>!app.closest('[data-variant]')?.hidden)?.querySelector('[id$="-tracking"]')?.scrollIntoView({block:'nearest',behavior:'instant'});return;}
    if(el.hasAttribute('data-view-application')) {state.selectedApplication=el.dataset.viewApplication;openModal('application');return;}
    if(el.hasAttribute('data-download')) {downloadApplication(el.dataset.download);return;}
    if(el.hasAttribute('data-setup')) {state.selectedApplication=el.dataset.application;if(selectedApplication().status==='approved')openModal(el.dataset.setup);return;}
    if(el.hasAttribute('data-legal')) {openModal(el.dataset.legal);return;}
    if (el.hasAttribute('data-budget')) {state.amount=Number(el.dataset.budget);updatePrice();save();return;}
    if (el.hasAttribute('data-payment')) {state.answers.payment=el.dataset.payment;render();return;}
    if (el.hasAttribute('data-chat')) {sendChat(el.dataset.chat);return;}
    switch (el.dataset.action) {
      case 'next':if(state.screen===0)go(1);else if(state.screen===1)streamAdvance();else advanceFlow();break;
      case 'back':if(state.screen===1 && state.aboutStage>0){state.aboutStage--;render();showActiveStage();}else if(state.screen===2 && state.healthPart==='questions'){if(state.qdIndex>0){state.qdIndex--;render();showActiveStage();}else{state.healthPart='consent';render();}}else if(state.screen===2){state.aboutStage=4;go(1);}else go(0);break;
      case 'preview-current':openModal('current-application');break;
      case 'edit':if(state.modal)closeModal();else{state.editing=false;render();}break;
      case 'chat':state.chat=!state.chat;render();break;
      case 'send-chat':sendChat();break;
      case 'account-menu':state.accountMenu=!state.accountMenu;render();if(state.accountMenu)el.closest('.ft-account-control')?.querySelector('[role="menuitem"]')?.focus({preventScroll:true});break;
      case 'account':if(state.signedIn){state.portalTab='overview';go(5);}else{state.returnScreen=state.screen===6?state.returnScreen:state.screen;state.authError='';state.authStage='identify';go(6);}break;
      case 'login-back':state.authValues={};state.authError='';state.authStage='identify';go(state.returnScreen<=4?state.returnScreen:0);break;
      case 'login-submit':submitLogin();break;
      case 'change-login':state.authStage='identify';state.authValues.authCode='';state.authError='';render();break;
      case 'sign-out':state.signedIn=false;state.authValues={};state.authError='';state.authStage='identify';state.returnScreen=0;go(6);break;
      case 'apply-more':startAnotherApplication();break;
      case 'adjust':openModal('adjust');break;
      case 'quote-details':state.editing=!state.editing;render();break;
      case 'amount-select':state.amountSelect=!state.amountSelect;render();break;
      case 'close-modal':closeModal();break;
      case 'save-adjust':if(state.amount!==state.draftAmount){state.amount=state.draftAmount;state.mibComplete=false;state.healthPart='consent';}state.answers.coverageChoice=String(state.amount);closeModal();save();break;
      case 'edit-profile':openModal('profile');break;
      case 'save-profile':saveAccountProfile();break;
      case 'save-beneficiary':saveApprovedSetup('beneficiary');break;
      case 'save-payment':saveApprovedSetup('payment');break;
      case 'download-current':downloadApplication(state.selectedApplication);break;
      case 'beneficiary':state.answers.extraBen=!state.answers.extraBen;render();break;
      case 'lookup':state.error='Membership lookup is unavailable in this interactive preview. Your information has not been sent.';render();break;
    }
  });
  root.addEventListener('submit',event=>{if(event.target.matches('[data-login-form]')){event.preventDefault();submitLogin();}});
  root.addEventListener('focusin',event=>{if(state.screen!==1 || state.modal || renderingStream)return;const prompt=event.target.closest('[data-flow-key]');if(prompt){state.flowActive=prompt.dataset.flowKey;root.querySelectorAll('[data-flow-key]').forEach(element=>element.dataset.active=String(element===prompt));}});
  root.addEventListener('keydown',event=>{
    if(event.key==='Enter' && event.target.closest('[data-login-form]')){event.preventDefault();submitLogin();return;}
    if(event.key==='Enter' && state.screen===1 && !state.modal && !state.accountMenu && event.target.matches('input:not([type="range"]):not([type="hidden"])') && !event.target.closest('.ft-chat-dock') && !document.querySelector('[role="listbox"]') && !event.isComposing){event.preventDefault();streamAdvance(event.target.closest('[data-flow-key]')?.dataset.flowKey);return;}
    if(event.key==='Enter' && event.target.matches('[data-chat-input]')){event.preventDefault();sendChat();}
    if(state.accountMenu && event.target.closest('.ft-account-control')){
      const control=event.target.closest('.ft-account-control'),items=[...control.querySelectorAll('[role="menuitem"]')];
      if(event.key==='Escape'){event.preventDefault();state.accountMenu=false;render();control.querySelector('[data-action="account-menu"]')?.focus({preventScroll:true});}
      else if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const index=items.indexOf(document.activeElement);items[event.key==='Home'?0:event.key==='End'?items.length-1:(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus({preventScroll:true});}
      else if(event.key==='Tab'){state.accountMenu=false;render();}
    }
  });
  root.addEventListener('cancel',event=>{if(event.target.tagName==='DIALOG'){event.preventDefault();closeModal();}},true);
  window.addEventListener('app:open-privacy-notice',()=>openModal('privacy'));
  window.addEventListener('resize',()=>apps.forEach(app=>{positionDock(app);const dialog=app.querySelector('dialog[open]');if(dialog && !app.closest('[data-variant]')?.hidden)showPositionedDialog(app,dialog);}));
  if(globalThis.MutationObserver)new MutationObserver(()=>apps.forEach(positionDock)).observe(root,{attributes:true,subtree:true,attributeFilter:['hidden']});
  render();
  const design = {screen:steps[state.screen] || (state.screen===5?'Applicant account':state.screen===6?'Sign in':'Complete'),memberContext:state.memberContext,financialRequired:false,decisionScenario:state.decisionScenario};
  if (globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:()=>{state.memberContext=design.memberContext;state.financialRequired=design.financialRequired;state.decisionScenario=design.decisionScenario;if(design.screen==='Applicant account')state.signedIn=true;go(design.screen==='Applicant account'?5:design.screen==='Sign in'?6:design.screen==='Complete'?4:steps.indexOf(design.screen));}});
    tweak.addSelect(design,'screen',{label:'Preview screen',options:[...steps,'Complete','Sign in','Applicant account']});
    tweak.addSelect(design,'memberContext',{label:'Member context',options:['Known member','No member session']});
    tweak.addToggle(design,'financialRequired',{label:'Financial questionnaire required'});
    tweak.addSelect(design,'decisionScenario',{label:'Decision result',options:[{value:'referred',label:'Sent for review'},{value:'conditionally-approved',label:'Conditionally approved'},{value:'soft-declined',label:'Unable to offer'},{value:'database-unavailable',label:'Processing unavailable'}]});
  }
  window.addEventListener('openai:set_globals',event=>{
    const snapshot=event.detail?.globals?.widgetState;
    if(!snapshot || ownSnapshots.has(JSON.stringify(snapshot.privateContent))) return;
    const before=JSON.stringify([state.screen,state.amount,state.age,state.state,state.gender,state.tobacco,state.memberContext]);
    restore(snapshot);
    if(before!==JSON.stringify([state.screen,state.amount,state.age,state.state,state.gender,state.tobacco,state.memberContext]))render();
  });
})();
</script>
